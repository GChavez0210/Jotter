name: Release

# A `v*` tag builds the Windows x64 and ARM64 installers and the Linux AppImage and .deb, and
# attaches them to a draft GitHub release, which a maintainer reviews and publishes. A pull
# request that changes this file builds the same packages as workflow artifacts, without a
# release, so the pipeline is tested first.
#
# Installed copies of Jotter update themselves from this release. Once the repository has the
# TAURI_SIGNING_PRIVATE_KEY secret, each build also signs its installer and the release gains
# a latest.json feed that the app reads. The release body is the version's CHANGELOG.md section,
# which the app shows before it installs. See "Releases and Code Signing" in the README.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      # Each action reads and replaces latest.json. Keep release uploads sequential.
      max-parallel: 1
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          # GitHub's free ARM64 Windows runners serve public repositories only, so the ARM64
          # build cross-compiles on the x64 runner, whose Visual Studio has the ARM64 tools.
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    env:
      # Signing turns on once these secrets exist. See "Code signing" in the README.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
      # Update signing turns on once this secret exists. See "Releases and Code Signing" in the README.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version."
          }

      - name: Set up code signing
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --locked
          $sign = "trusted-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d Jotter %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $sign } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path signing.json -Value $config
          "TAURI_SIGNING_ARGS=--config signing.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Turn on update signing
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: pwsh
        run: '"TAURI_UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" | Out-File -FilePath $env:GITHUB_ENV -Append'

      - name: Extract the release notes
        id: notes
        shell: bash
        run: |
          strict=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then strict="--strict"; fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            node scripts/release-notes.mjs "${{ github.ref_name }}" $strict
            echo
            echo 'Windows installers come in x64 and ARM64 builds, each as an .exe (per-user setup) and an .msi. Linux ships an x86_64 AppImage and a .deb.'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} ${{ env.TAURI_SIGNING_ARGS }} ${{ env.TAURI_UPDATER_ARGS }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Jotter ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Keep the installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jotter-windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: windows
    runs-on: ubuntu-22.04
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-x86_64

      # WebKitGTK and its bundling tools are not on the runner image. The AppImage links
      # against the runner's glibc, so the oldest supported runner builds it.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: npm ci

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version." >&2
            exit 1
          fi

      - name: Turn on update signing
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: echo "TAURI_UPDATER_ARGS=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"

      - name: Extract the release notes
        id: notes
        run: |
          strict=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then strict="--strict"; fi
          {
            echo 'body<<RELEASE_NOTES_EOF'
            node scripts/release-notes.mjs "${{ github.ref_name }}" $strict
            echo
            echo 'Windows installers come in x64 and ARM64 builds, each as an .exe (per-user setup) and an .msi. Linux ships an x86_64 AppImage and a .deb.'
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build the AppImage and .deb
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The bundle targets come from tauri.linux.conf.json.
          args: ${{ env.TAURI_UPDATER_ARGS }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Jotter ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Keep the packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jotter-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
