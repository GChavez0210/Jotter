name: Release

# A `v*` tag builds the Windows x64 and ARM64 installers and the Linux AppImage and .deb, and
# attaches them to a draft GitHub release, which a maintainer reviews and publishes. A pull
# request that changes this file builds the same packages as workflow artifacts, without a
# release, so the pipeline is tested first.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          # GitHub's free ARM64 Windows runners serve public repositories only, so the ARM64
          # build cross-compiles on the x64 runner, whose Visual Studio has the ARM64 tools.
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    env:
      # Signing turns on once these secrets exist. See "Code signing" in the README.
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.TRUSTED_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version."
          }

      - name: Set up code signing
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --locked
          $sign = "trusted-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d Jotter %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $sign } } } | ConvertTo-Json -Depth 5 -Compress
          Set-Content -Path signing.json -Value $config
          "TAURI_SIGNING_ARGS=--config signing.json" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} ${{ env.TAURI_SIGNING_ARGS }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Jotter ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Windows installers come in x64 and ARM64 builds, each as an .exe (per-user setup) and an .msi. Linux ships an x86_64 AppImage and a .deb.
          releaseDraft: true
          prerelease: false

      - name: Keep the installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jotter-windows-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux-x86_64

      # WebKitGTK and its bundling tools are not on the runner image. The AppImage links
      # against the runner's glibc, so the oldest supported runner builds it.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: npm ci

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match tauri.conf.json version $version." >&2
            exit 1
          fi

      - name: Build the AppImage and .deb
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The bundle targets come from tauri.linux.conf.json.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Jotter ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. Windows installers come in x64 and ARM64 builds, each as an .exe (per-user setup) and an .msi. Linux ships an x86_64 AppImage and a .deb.
          releaseDraft: true
          prerelease: false

      - name: Keep the packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jotter-linux-x86_64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
