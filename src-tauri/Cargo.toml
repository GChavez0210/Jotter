[package]
name = "jotter"
version = "0.1.0"
description = "Windows-native Markdown notes app compatible with Obsidian vaults"
authors = ["Jotter Contributors"]
edition = "2021"

[lib]
name = "jotter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
arboard = "3.4"
comrak = { version = "0.31", default-features = false }
window-vibrancy = "0.8"
notify = "7.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.14"
