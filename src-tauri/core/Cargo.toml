[package]
name = "jotter-core"
version = "0.5.3"
description = "Vault logic shared by the Jotter app and its command-line tool"
authors = ["Jotter Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "jotter_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
comrak = { version = "0.31", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
trash = "5.2"
tantivy = { version = "0.27", default-features = false, features = ["lz4-compression"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
# Same versions `trash` already pulls in. Used to recycle without falling back to permanent deletion.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-core = "0.62"

[dev-dependencies]
tempfile = "3.14"
